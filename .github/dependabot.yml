version: 2
updates:
  # Keep GitHub Actions used in workflows up to date.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "github-actions"]
    commit-message:
      prefix: "chore(deps)"

  # Keep the base image and any Docker-related version pins fresh.
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "docker"]
    commit-message:
      prefix: "chore(deps)"
    # The base image stays on the Ubuntu LTS that GitHub-hosted runners use.
    # Ubuntu tags are YY.MM: for Dependabot 24.04 -> 25.10 is a major bump and
    # 24.04 -> 24.10 a minor one, and both land on an interim release. Interim
    # releases break the setup-* actions (prebuilt binaries exist only for the
    # hosted-runner LTS releases) and lose their package archive after nine
    # months. Moving to the next LTS is a deliberate, manual change (see
    # docs/bundled-tools.md); digest updates of the current tag still arrive.
    ignore:
      - dependency-name: "ubuntu"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
