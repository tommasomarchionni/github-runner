name: Publish image

# Builds and publishes a multi-arch image to GitHub Container Registry (GHCR)
# so it can be pulled directly (no local build needed) in docker-compose.yml,
# Dokploy, or a plain `docker run`.
#
# Tags produced:
#   - "latest"        on every push to main
#   - "edge"          on every push to main (explicit alias of latest)
#   - "vX.Y.Z"/"X.Y"/"X" on pushed tags matching v*.*.*
#   - "sha-<short-sha>" always, for exact reproducibility
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths:
      - "docker/**"
      - ".github/workflows/publish-image.yml"
  workflow_dispatch:
    inputs:
      runner_version:
        description: "actions/runner version to bake in (overrides the Dockerfile default)"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (for arm64 builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=edge,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./docker
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            ${{ inputs.runner_version != '' && format('RUNNER_VERSION={0}', inputs.runner_version) || '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
