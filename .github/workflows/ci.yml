name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint entrypoint.sh
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: "./docker"

  hadolint:
    name: Hadolint (Dockerfile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker/Dockerfile

  unit-tests:
    name: Unit test (bats)
    runs-on: ubuntu-latest
    needs: [shellcheck]
    steps:
      - uses: actions/checkout@v4
      - name: Install bats
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bats
      - name: Run entrypoint unit tests
        run: bats tests/test_entrypoint.bats

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: [hadolint, unit-tests]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./docker
          file: ./docker/Dockerfile
          push: false
          load: true
          tags: github-runner:ci
          build-args: |
            INSTALL_DOCKER_CLI=true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify the image starts and fails gracefully without a PAT
        run: |
          set +e
          docker run --rm github-runner:ci 2>&1 | tee /tmp/out.log
          grep -q "GITHUB_PAT is required" /tmp/out.log
      - name: Verify Docker CLI is present in the image
        run: |
          docker run --rm --entrypoint docker github-runner:ci --version
