name: Runner smoke test

# Trigger this manually (repository "Actions" tab) AFTER starting the
# runner container, to verify it registered correctly and can execute a
# real job.
on:
  workflow_dispatch:
    inputs:
      labels:
        description: 'Runner labels to target, as a JSON array, e.g. ["self-hosted","linux","x64","ci"]'
        required: false
        default: '["self-hosted"]'

permissions:
  contents: read

jobs:
  smoke-test:
    # GitHub Actions expressions have no string-split function, so the
    # input must already be a JSON array literal (see the input
    # description above) rather than a comma-separated string.
    runs-on: ${{ fromJSON(inputs.labels) }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Environment info
        run: |
          echo "Host: $(hostname)"
          uname -a
          echo "---"
          whoami
          id

      - name: Check base tools
        run: |
          git --version
          curl --version | head -n1
          jq --version
          ip -V

      - name: Check Docker CLI
        run: docker version

      - name: Write/read on the persistent work directory
        run: |
          echo "smoke-test-$(date -u +%s)" > smoke-test.txt
          cat smoke-test.txt

      - name: Result
        run: echo "The self-hosted runner executed the job successfully."
